version: 2

models:
  - name: kpi_approval_rate
    description: >
      KPI 1 — Approval rate. approved_attempts / total_attempts,
      per day × segment. Non-additive ratio: re-aggregate from counts.
    columns:
      - name: approval_rate
        tests:
          - not_null
          - dbt_utils_accepts_range:
              min: 0
              max: 1

  - name: kpi_tpv
    description: >
      KPI 2 — TPV. Σ amount of approved purchases, per day × channel.
      Fully additive measure.
    columns:
      - name: tpv
        tests:
          - not_null

  - name: kpi_delinquency_rate
    description: >
      KPI 3 — Delinquency rate proxy. limit_exceeded declines / total declines,
      per day × decline_reason. Replaced by invoice-based metric when payment
      events land in the lake.
    columns:
      - name: delinquency_rate_proxy
        tests:
          - not_null

  - name: kpi_limit_utilization
    description: >
      KPI 4 — Monthly limit-stock proxy per day × segment. Capacity is 30% of
      monthly income until limit-assigned events are available; used and
      available balances are cumulative within each calendar month.
    columns:
      - name: limit_utilization
        tests:
          - not_null

  - name: kpi_activation_rate
    description: >
      KPI 5 — Activation rate proxy. Clients with an approved purchase within
      7 days of onboarding / onboarded clients, per cohort day × segment.
    columns:
      - name: activation_rate
        tests:
          - not_null
