name: cardlab
version: "1.0.0"
profile: cardlab

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  cardlab:
    # Every layer is physically materialized in lake/events.duckdb.
    +materialized: table
    staging:
      +schema: bronze
    marts:
      +schema: silver
      kpis:
        +schema: gold
    gold:
      +schema: gold
