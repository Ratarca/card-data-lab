services:
  postgres:
    image: postgres:16
    container_name: cardlab-postgres
    environment:
      POSTGRES_USER: cardlab
      POSTGRES_PASSWORD: cardlab
      POSTGRES_DB: cardlab
    ports:
      # Host port 5432 is taken by the Airflow postgres; use 5433 for the lab.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardlab"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  portainer:
    image: portainer/portainer-ce:latest
    container_name: cardlab-portainer
    restart: unless-stopped
    ports:
      # Web UI: http://localhost:9443
      - "9443:9443"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  pgdata:
  portainer_data:
